[opener]
edit = [{ run = 'nvim "$@"', block = true, for = "unix" }]

[open]
prepend_rules = [
  { mime = "text/*", use = "edit" },
  { mime = "application/{json,toml,yaml,xml}", use = "edit" },
  { name = "*.toml", use = "edit" },
  { name = "*.json", use = "edit" },
  { name = "*.yaml", use = "edit" },
  { name = "*.lua", use = "edit" },
]

[mgr]
show_hidden = true
sort_by = "alphabetical"
sort_sensitive = true
sort_reverse = false
sort_dir_first = true

[preview]
wrap = "yes"
